    /* ===== Lively gold theme ===== */
    :root { --gold-1:#fff3cf; --gold-2:#f3d27c; --gold-3:#d9a93e; --gold-4:#b07d1f; --gold-ink:#5a4110; }
    body { background:linear-gradient(165deg,#fffdf7 0%,#fff8e8 45%,#fffdf9 100%); background-attachment:fixed; }
    body::before { opacity:.35; animation:dotsDrift 40s linear infinite; }
    .ambient { position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
    .ambient .blob { position:absolute; border-radius:50%; filter:blur(48px); opacity:.55; animation:blobFloat 18s ease-in-out infinite alternate; }
    .ambient .b1 { width:340px; height:340px; top:-90px; right:-80px; background:radial-gradient(circle,#ffe2a0,transparent 70%); }
    .ambient .b2 { width:300px; height:300px; bottom:8%; left:-110px; background:radial-gradient(circle,#ffd98a,transparent 70%); animation-duration:22s; animation-delay:-6s; }
    .ambient .b3 { width:260px; height:260px; top:42%; right:-90px; background:radial-gradient(circle,#fff0c4,transparent 70%); animation-duration:26s; animation-delay:-11s; }
    .ambient .star { position:absolute; bottom:-20px; width:var(--s,8px); height:var(--s,8px); background:linear-gradient(135deg,#ffe9a8,#d6a23a); clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); opacity:0; animation:starRise var(--d,14s) linear infinite; animation-delay:var(--delay,0s); }
    @keyframes blobFloat { 0%{transform:translate(0,0) scale(1)} 50%{transform:translate(-30px,40px) scale(1.12)} 100%{transform:translate(25px,-20px) scale(.95)} }
    @keyframes starRise { 0%{transform:translateY(0) rotate(0);opacity:0} 10%{opacity:.85} 85%{opacity:.6} 100%{transform:translateY(-110vh) rotate(360deg);opacity:0} }
    @keyframes dotsDrift { from{background-position:0 0} to{background-position:230px 230px} }

    /* header */
    .user-header,.admin-header { position:relative; background:rgba(255,255,255,.78); border:1px solid rgba(232,207,146,.55); box-shadow:0 10px 30px rgba(176,125,31,.10); }
    .user-header::after,.admin-header::after { content:""; position:absolute; left:18px; right:18px; bottom:-1px; height:2px; border-radius:2px; background:linear-gradient(90deg,transparent,var(--gold-3),var(--gold-2),var(--gold-3),transparent); background-size:200% 100%; animation:goldSlide 4s linear infinite; }
    .brand-mark { position:relative; overflow:hidden; animation:markBreath 3.6s ease-in-out infinite; }
    .brand-mark::after,.gate-mark::after { content:""; position:absolute; inset:-40%; border:0; border-radius:0; background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%); transform:translateX(-120%); animation:glint 3.8s ease-in-out infinite; }
    .gate-mark { position:relative; overflow:hidden; }
    .live-dot { animation:livePulse 1.6s ease-out infinite; }
    @keyframes goldSlide { from{background-position:0 0} to{background-position:200% 0} }
    @keyframes markBreath { 0%,100%{box-shadow:0 8px 18px rgba(169,123,28,.20)} 50%{box-shadow:0 8px 26px rgba(217,169,62,.45)} }
    @keyframes glint { 0%,55%{transform:translateX(-120%)} 80%,100%{transform:translateX(120%)} }
    @keyframes livePulse { 0%{box-shadow:0 0 0 0 rgba(38,155,112,.55)} 100%{box-shadow:0 0 0 9px rgba(38,155,112,0)} }

    /* hero */
    .user-hero { position:relative; border:1.5px solid transparent; background:linear-gradient(135deg,rgba(255,255,255,.97),rgba(255,250,236,.96)) padding-box, linear-gradient(120deg,#f6e2a6,#d9a93e,#fff3cf,#c8952e,#f6e2a6) border-box; background-size:100% 100%,300% 300%; animation:heroIn .7s cubic-bezier(.2,.8,.2,1) both, borderFlow 8s linear infinite; box-shadow:0 22px 50px rgba(176,125,31,.14); }
    .hero-copy h1 span { background:linear-gradient(100deg,#a77a1b 0%,#e6b84f 30%,#fff0bf 45%,#d9a93e 60%,#a77a1b 100%); background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:textShine 4.5s linear infinite; }
    .hero-copy h1 span::after { opacity:.55; }
    .trophy-card { animation:bob 3.4s ease-in-out infinite; }
    .art-orbit { animation:spin 22s linear infinite; }
    .art-chip { animation:chipFloat 4s ease-in-out infinite; }.chip-bottom { animation-delay:-2s; }
    @keyframes heroIn { from{opacity:0;transform:translateY(16px) scale(.98)} to{opacity:1;transform:none} }
    @keyframes borderFlow { 0%{background-position:0 0,0% 50%} 100%{background-position:0 0,300% 50%} }
    @keyframes textShine { from{background-position:250% 0} to{background-position:0 0} }
    @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1.5deg)} 50%{transform:translateY(-9px) rotate(1.5deg)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes chipFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

    /* player card */
    .player-card { position:relative; border:1.5px solid transparent; background:linear-gradient(#fff,#fffdf8) padding-box, linear-gradient(150deg,#f3dc9c,#efe3c4 40%,#e1b95a) border-box; box-shadow:0 20px 44px rgba(150,108,27,.12); animation:heroIn .6s .08s cubic-bezier(.2,.8,.2,1) both; }
    body.in-game .player-card { margin-top:4px;padding:14px;border-radius:16px; }
    .stage-enter .player-content { animation:stageIn .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes stageIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    .kicker-icon { background:linear-gradient(145deg,#fff1c9,#f2d68a); box-shadow:0 5px 12px rgba(190,145,48,.2); }
    .form-input { border-color:#ecdcb3; background:#fffdf8; transition:border-color .2s,box-shadow .2s; }
    .form-input:focus { outline:none; border-color:var(--gold-3); box-shadow:0 0 0 4px rgba(217,169,62,.18); background:#fff; }

    /* buttons */
    .btn { position:relative; overflow:hidden; transition:transform .15s,box-shadow .2s; }
    .btn:active:not(:disabled) { transform:scale(.97); }
    .btn-primary { color:var(--gold-ink); background:linear-gradient(130deg,#fbe7a9 0%,#ecc764 45%,#d6a53d 100%); box-shadow:0 10px 22px rgba(190,145,48,.30),inset 0 1px 0 rgba(255,255,255,.7); font-weight:700; }
    .btn-primary::after { content:""; position:absolute; top:0; bottom:0; width:45%; left:-60%; background:linear-gradient(105deg,transparent,rgba(255,255,255,.75),transparent); transform:skewX(-18deg); animation:btnShine 3.2s ease-in-out infinite; }
    .btn-primary:disabled::after { display:none; }
    @keyframes btnShine { 0%,50%{left:-60%} 85%,100%{left:120%} }

    /* quiz */
    .quiz-head .pill { background:linear-gradient(130deg,#fff3cf,#f6dc94); color:#7a5712; font-weight:700; box-shadow:0 4px 10px rgba(190,145,48,.18); }
    .progress-track { background:#f5ebd2; overflow:hidden; }
    .progress-fill { position:relative; background:linear-gradient(90deg,#c08f2b,#f0cf72,#c08f2b); background-size:200% 100%; animation:goldSlide 2.5s linear infinite; transition:width .6s cubic-bezier(.2,.8,.2,1); }
    .question-box { position:relative; border:1.5px solid transparent; background:linear-gradient(120deg,#fffdf6,#fff) padding-box, linear-gradient(120deg,#e9c66d,#fff0c2,#d9a93e) border-box; box-shadow:0 12px 26px rgba(176,125,31,.12); }
    .question-box::before,.question-box::after { content:"◆"; position:absolute; top:50%; transform:translateY(-50%); color:var(--gold-3); font-size:12px; }
    .question-box::before { right:-7px; }.question-box::after { left:-7px; }
    .option-btn { position:relative; border:1.5px solid #f0e3c3; background:linear-gradient(180deg,#fff,#fffbf1); box-shadow:0 4px 10px rgba(150,108,27,.06); font-weight:600; }
    .option-btn:hover:not(:disabled) { border-color:#e0bf68; transform:translateY(-2px); box-shadow:0 10px 18px rgba(190,145,48,.16); }
    .option-letter { background:linear-gradient(145deg,#fff3cf,#f0d382); color:#7d5a14; font-weight:700; box-shadow:inset 0 1px 0 rgba(255,255,255,.8); transition:.2s; }
    .option-btn.selected { border-color:#d6a53d; background:linear-gradient(130deg,#fff6dc,#ffecb8); color:#6d4f12; box-shadow:0 0 0 3px rgba(217,169,62,.2),0 10px 20px rgba(190,145,48,.18); animation:selectPop .3s ease; }
    .option-btn.selected .option-letter { background:linear-gradient(145deg,#e9bf56,#c38f27); color:#fff; }
    .option-btn.correct { border-color:#62c695; background:linear-gradient(130deg,#effcf4,#d9f6e6); color:#1f7a50; animation:correctGlow 1.2s ease 2; }
    .option-btn.correct .option-letter { background:#34ad73; color:#fff; }
    .option-btn.wrong { animation:shake .45s ease; }.option-btn.wrong .option-letter { background:#e06178; color:#fff; }
    .stage-enter .option-btn { animation:optIn .45s cubic-bezier(.2,.8,.2,1) both; }
    .stage-enter .option-btn:nth-child(1){animation-delay:.08s}.stage-enter .option-btn:nth-child(2){animation-delay:.14s}.stage-enter .option-btn:nth-child(3){animation-delay:.2s}.stage-enter .option-btn:nth-child(4){animation-delay:.26s}
    .help-btn { border:1.5px solid #f0e2bd; background:#fffdf7; transition:.2s; }
    .help-btn .help-symbol { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:linear-gradient(145deg,#fff1c9,#efcf78); box-shadow:inset 0 0 0 1px rgba(167,122,27,.18); }
    .help-btn.used { opacity:.45; text-decoration:line-through; }
    .answer-feedback { animation:stageIn .4s ease both; }
    @keyframes optIn { from{opacity:0;transform:translateX(-18px)} to{opacity:1;transform:none} }
    @keyframes selectPop { 50%{transform:scale(1.03)} }
    @keyframes correctGlow { 0%,100%{box-shadow:0 0 0 0 rgba(52,173,115,.0)} 50%{box-shadow:0 0 0 6px rgba(52,173,115,.22)} }
    @keyframes shake { 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

    /* result */
    .result-icon { position:relative; z-index:0; animation:resultPop .7s cubic-bezier(.3,1.6,.5,1) both; background:linear-gradient(145deg,#fff3cf,#f0cd6d); color:#8d6412; }
    .result-icon::before { content:""; position:absolute; inset:-22px; z-index:-1; border-radius:50%; background:repeating-conic-gradient(rgba(217,169,62,.28) 0 10deg,transparent 10deg 24deg); animation:spin 14s linear infinite; -webkit-mask:radial-gradient(circle,#000 35%,transparent 70%); mask:radial-gradient(circle,#000 35%,transparent 70%); }
    .result-stat { transition:transform .2s; animation:stageIn .5s ease both; }.result-stat:nth-child(2){animation-delay:.1s}.result-stat:nth-child(3){animation-delay:.2s}
    .result-stat b { background:linear-gradient(120deg,#a77a1b,#e2b44c); -webkit-background-clip:text; background-clip:text; color:transparent; }
    @keyframes resultPop { from{opacity:0;transform:scale(.4) rotate(-20deg)} to{opacity:1;transform:none} }

    /* confetti sparks */
    .iso-spark { position:fixed; z-index:200; width:8px; height:11px; border-radius:2px; pointer-events:none; animation:sparkFly 1.15s cubic-bezier(.15,.7,.3,1) forwards; }
    @keyframes sparkFly { 0%{transform:translate(-50%,-50%) scale(1);opacity:1} 100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 80px)) rotate(var(--rot)) scale(.5);opacity:0} }

    /* admin touch */
    .admin-hero,.admin-card,.metric-card,.admin-question-card { transition:transform .2s,box-shadow .2s; }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }

    /* App mark supplied by the user */
    .brand-mark { display:grid;place-items:center;padding:0;overflow:hidden;transform:none;background:#080808;border:1px solid #d8b45b;box-shadow:0 6px 18px rgba(160,119,30,.28); }

    .brand-mark::after { content:none !important;animation:none !important; }
    .gate-mark { padding:0;overflow:hidden;background:#080808;border:1px solid #d8b45b; }

    .gate-mark::after { content:none !important;animation:none !important; }

    /* Separate practice entry from the 24-hour official competition. */
    .entry-section-title { margin:1px 0 13px;font-size:20px;line-height:1.6; }
    .entry-mode-grid { display:grid;grid-template-columns:1fr;gap:13px; }
    .entry-mode-card { min-width:0;padding:16px;border:1px solid #efe6d1;border-radius:17px;background:linear-gradient(145deg,#fff,#fffdf7);box-shadow:0 8px 20px rgba(145,105,27,.055); }

    .entry-mode-head { display:flex;align-items:flex-start;gap:11px;margin-bottom:13px; }
    .entry-mode-icon { display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:1px solid #f0dfb2;border-radius:13px;background:linear-gradient(145deg,#fff2ca,#efd58f);color:#916915;font-size:22px;font-weight:900; }

    .entry-form { display:flex;flex-direction:column;gap:9px; }
    .entry-mode-card .form-field > span { font-size:13px; }
    .entry-mode-card .btn { width:100%;min-height:46px;font-size:14px; }
    .entry-note,.cooldown-hint { margin:0;color:#8b826f;font-size:12px;line-height:1.8; }
    .entry-note { padding:0 2px 2px; }
    .cooldown-hint { min-height:42px;padding:9px 11px;border:1px solid #eee6d3;border-radius:11px;background:#fffdf7; }
    .cooldown-hint.available { color:#347b5b;border-color:#dcefe2;background:#f4fbf6; }
    .cooldown-hint.locked { color:#9a5a31;border-color:#f1dfc8;background:#fff7ed; }
    .result-screen p.result-mode-note { max-width:420px;padding:8px 11px;border:1px solid #eee6d3;border-radius:10px;background:#fffdf7;color:#84775b;font-size:12px; }
    .competition-mode .closed-notice { margin:0 0 10px;padding:9px 10px;font-size:12px; }
    .entry-mode-card .form-input { min-height:46px; }
    @media (max-width:430px) {

      .entry-mode-card { padding:14px;border-radius:15px; }

      .entry-mode-head p,.entry-note,.cooldown-hint { font-size:12px; }
    }
    body:not(.in-game) .player-card { min-height:0; }
    .entry-mode-switch { display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:0 0 12px;padding:5px;border:1px solid #eee5d0;border-radius:14px;background:#fffaf0; }
    .entry-mode-switch-btn { min-height:42px;padding:8px 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#83765d;font-size:14px;font-weight:800;cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s; }

    .entry-mode-panel { padding:2px 1px 0; }

    .entry-mode-panel .form-field > span { font-size:13px; }

    @media (max-width:430px) {

    .code-management-card,.competition-report-card { margin-top:13px; }
    .code-management-card .admin-card-head,.competition-report-card .admin-card-head { align-items:flex-start; }
    .code-management-card .admin-card-head h2,.competition-report-card .admin-card-head h2 { margin:0;font-size:16px; }
    .code-management-card .admin-card-head p,.competition-report-card .admin-card-head p { margin:4px 0 0;color:#8a806c;font-size:12px;line-height:1.8; }
    .code-add-form { display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:10px;padding:12px;border:1px solid #eee6d3;border-radius:13px;background:#fffdf8; }
    .code-add-form .btn { min-height:44px;white-space:nowrap; }
    .code-management-note { margin:10px 2px;color:#8a806c;font-size:12px;line-height:1.85; }
    .admin-code-list,.competition-report-list { display:flex;flex-direction:column;gap:7px; }.competition-report-list { max-height:520px;overflow:auto;padding-inline-end:3px; }
    .admin-code-row { display:grid;grid-template-columns:minmax(120px,.7fr) minmax(0,1.4fr) auto;align-items:center;gap:9px;padding:9px 10px;border:1px solid #f0e8d6;border-radius:11px;background:#fff; }
    .admin-code-row code { direction:ltr;text-align:center;padding:6px 9px;border-radius:8px;background:#fff7e2;color:#705313;font-size:15px;font-weight:800;letter-spacing:1px; }
    .admin-code-row > span { color:#77705f;font-size:12px;line-height:1.7; }
    .admin-code-row .btn { min-height:32px;padding:6px 10px; }
    .competition-report-row { display:grid;grid-template-columns:minmax(110px,1fr) minmax(125px,auto) minmax(175px,1.2fr);align-items:center;gap:10px;padding:10px 11px;border:1px solid #f0e8d6;border-radius:11px;background:#fff; }
    .report-participant { min-width:0;display:flex;flex-direction:column;gap:2px; }
    .report-participant b { color:#514735;font-size:13px;overflow-wrap:anywhere; }
    .report-participant small,.report-date { color:#8c836f;font-size:11px;line-height:1.65; }
    .report-date { white-space:nowrap; }
    .report-outcome { justify-self:start;padding:5px 8px;border-radius:8px;font-size:11px;line-height:1.6; }
    .report-outcome.complete { color:#347b5b;background:#f0faf3; }
    .report-outcome.pending { color:#8a6b32;background:#fff7e5; }
    @media (max-width:680px) {
      .code-add-form { grid-template-columns:1fr; }
      .code-add-form .btn { width:100%; }
      .admin-code-row { grid-template-columns:minmax(0,1fr) auto; }
      .admin-code-row > span { grid-column:1;grid-row:2; }
      .admin-code-row .btn { grid-column:2;grid-row:1/3; }
      .competition-report-row { grid-template-columns:minmax(0,1fr) auto;gap:5px 8px; }
      .report-date { grid-column:1;grid-row:2; }
      .report-outcome { grid-column:2;grid-row:1/3; }
    }

  --violet:var(--iso-teal);--violet-dark:#116b67;--violet-soft:#e2f3ec;
  --teal:var(--iso-teal);--teal-soft:#e2f3ec;--orange:var(--iso-orange);--orange-soft:#ffebe4;
  --pink:#dc7482;--pink-soft:#fff0f2;--green:#278c69;--green-soft:#e4f6eb;--red:#d65362;--red-soft:#fff0f1;
  --shadow:0 12px 28px rgba(27,72,66,.09);

      function updateCompetitionEntryState() {
        const codeInput=document.getElementById('competitionAccessCode');
        const hint=document.getElementById('competitionHint'),button=document.getElementById('competitionJoinButton');
        if(!codeInput||!hint||!button)return;
        const code=normalizeAccessCode(codeInput.value),entry=code.length===10?findCompetitionCode(code):null;
        const remaining=entry?getCompetitionCooldown(code):0,open=settings.isOpen!==false,available=publicQuestions().length>0;
        let message=tx('شماره ملی ۱۰ رقمی خود را وارد کن تا مجوز بررسی شود.','أدخل رقمك الوطني المكوّن من ١٠ أرقام للتحقق من الإذن.'),state='';
        if(!open)message=tx('ورود رسمی به مسابقه فعلاً بسته است.','الدخول الرسمي إلى المسابقة مغلق حاليًا.');
        else if(!available)message=tx('هنوز سؤالی برای مسابقه منتشر نشده است.','لم تُنشر أي أسئلة للمسابقة بعد.');
        else if(!settings.competitionCodes.length)message=tx('مدیر هنوز شماره ملی مجازی برای مسابقه ثبت نکرده است.','لم يسجّل المدير بعد أي أرقام وطنية مسموحًا بها للمسابقة.');
        else if(code.length!==10)message=tx('شماره ملی باید دقیقاً ۱۰ رقم باشد.','يجب أن يتكوّن الرقم الوطني من ١٠ أرقام بالضبط.');

        else if(remaining){message=`${tx('تا ورود دوباره ','يمكنك الدخول مجددًا بعد ')}${formatCooldown(remaining)}${tx(' باقی مانده است.','.')}`;state='locked';}
        else {message=tx('شماره ملی معتبر است و می‌توانی وارد مسابقه شوی.','الرقم الوطني صالح؛ يمكنك دخول المسابقة.');state='available';}

      function syncCompetitionCooldownTimer() {

      function joinGame(mode,playerName,accessCode='') {
        unlockQuizAudio();
        const isCompetition=mode==='competition',name=isCompetition?'':(String(playerName||'').trim()||'بازیکن');
        if(isCompetition&&settings.isOpen===false){showToast('ورود رسمی به مسابقه فعلاً بسته است.');return;}
        const selectedDeck=pickRandomDeck(Math.max(1,Math.min(15,Number(settings.maxQuestions)||15)));
        if(!selectedDeck.length){showToast('فعلاً سؤالی برای بازی منتشر نشده است.');return;}
        let reportId=null,code='',participantLabel='';
        if(isCompetition){
          code=normalizeAccessCode(accessCode);
          if(code.length!==10){showToast('شماره ملی باید دقیقاً ۱۰ رقم باشد.');return;}
          if(!findCompetitionCode(code)){showToast('این شماره ملی در فهرست مجوزهای مسابقه نیست.');return;}
          const remaining=getCompetitionCooldown(code);
          if(remaining){showToast(`تا ورود دوباره ${formatCooldown(remaining)} باقی مانده است.`);updateCompetitionEntryState();return;}
          const start=recordCompetitionStart(code,selectedDeck.length);
          if(!start.ok){
            if(start.storage)showToast('ثبت ورود رسمی ممکن نشد؛ فضای ذخیره‌سازی مرورگر را بررسی کن.');
            else showToast(`تا ورود دوباره ${formatCooldown(start.remaining)} باقی مانده است.`);
            updateCompetitionEntryState();return;
          }
          reportId=start.reportId;participantLabel=`شماره ملی ···${code.slice(-4)}`;
        }
        const deck=selectedDeck.map(shuffleQuestionOptions);
        userGame={phase:'playing',mode:isCompetition?'competition':'free',playerName:isCompetition?'شرکت‌کننده':name,participantLabel,accessCode:isCompetition?code:'',reportId,deck,index:0,selected:null,hidden:[],revealed:false,isCorrect:false,timedOut:false,questionDeadline:isArabicUser()?0:Date.now()+QUESTION_TIME_LIMIT_MS,translationRemainingMs:isArabicUser()?QUESTION_TIME_LIMIT_MS:null,lastTimerCueSecond:QUESTION_TIME_LIMIT_SECONDS+1,correctCount:0,points:0,used:{fifty:false,audience:false,friend:false},helpNotice:null,saved:false};
        if(isCompetition)playCompetitionEntrySound();else playFreeEntrySound();

      function parseCsvRows(text) {
        const source=String(text||'').replace(/^\uFEFF/,'');let delimiter=',',quoted=false,counts={',':0,';':0,'\t':0};
        for(let i=0;i<source.length;i++){const ch=source[i];if(ch==='"'){if(quoted&&source[i+1]==='"'){i++;continue;}quoted=!quoted;continue;}if(!quoted&&(ch==='\n'||ch==='\r'))break;if(!quoted&&Object.prototype.hasOwnProperty.call(counts,ch))counts[ch]++;}
        delimiter=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
        const rows=[];let row=[],field='',inQuotes=false;
        for(let i=0;i<source.length;i++){
          const ch=source[i];
          if(ch==='"'){if(inQuotes&&source[i+1]==='"'){field+='"';i++;}else inQuotes=!inQuotes;continue;}
          if(ch===delimiter&&!inQuotes){row.push(field);field='';continue;}
          if((ch==='\n'||ch==='\r')&&!inQuotes){if(ch==='\r'&&source[i+1]==='\n')i++;row.push(field);field='';rows.push(row);row=[];continue;}
          field+=ch;
        }
        row.push(field);if(row.some(value=>String(value).trim()!==''))rows.push(row);return rows;
      }
      function parseImportedQuestionRows(rows) {
        const headerIndex=rows.findIndex(row=>Array.isArray(row)&&row.some(value=>String(value??'').trim()!==''));
        if(headerIndex<0)throw new Error('فایل خالی است یا برگهٔ «سوالات» داده‌ای ندارد.');
        const header=rows[headerIndex]||[],keys=header.map(importHeaderKey);
        const aliases={
          question:['متنسؤال','متنسوال','سؤال','سوال','پرسش','question'],
          category:['دستهبندی','نوعدستهبندی','دسته','موضوع','category'],
          level:['سطحسؤال','سطحسوال','سطحدشواری','درجهسختی','level','difficulty'],
          option1:['گزینه1','گزینهالف','گزینهاول','option1','optiona'],
          option2:['گزینه2','گزینهب','گزینهدوم','option2','optionb'],
          option3:['گزینه3','گزینهج','گزینهسوم','option3','optionc'],
          option4:['گزینه4','گزینهد','گزینهچهارم','option4','optiond'],
          correct:['شمارهگزینهدُرست1تا4','شمارهگزینهدرست1تا4','شمارهگزینهصحیح1تا4','شمارهگزینهدُرست','شمارهگزینهدرست','شمارهگزینهصحیح','گزینهدُرست','گزینهدرست','گزینهصحیح','پاسخدرست','پاسخصحیح','correctanswer','correctoption']
        };
        const columns={};for(const [field,names] of Object.entries(aliases))columns[field]=keys.findIndex(key=>names.some(name=>key===importHeaderKey(name)));
        const missing=['question','level','option1','option2','option3','option4','correct'].filter(key=>columns[key]<0);
        if(missing.length)throw new Error('سرستون‌های لازم در ردیف اول پیدا نشدند. از قالب میزان استفاده کن؛ سرستون‌های «متن سؤال»، «سطح سؤال»، چهار گزینه و «شماره گزینه درست» باید موجود باشند.');
        const valueAt=(row,key)=>columns[key]<0?'':normalizeImportValue(row[columns[key]]);
        const valid=[],errors=[];
        for(let i=headerIndex+1;i<rows.length;i++){
          const row=rows[i]||[];if(!row.some(value=>String(value??'').trim()!==''))continue;
          const question=valueAt(row,'question'),category=valueAt(row,'category')||'عمومی',rawLevel=valueAt(row,'level'),options=[1,2,3,4].map(n=>valueAt(row,'option'+n)),rawCorrect=valueAt(row,'correct');
          const issues=[];
          if(!question)issues.push('متن سؤال خالی است');
          if(question.length>240)issues.push('متن سؤال بیشتر از ۲۴۰ نویسه است');
          if(category.length>35)issues.push('دسته‌بندی بیشتر از ۳۵ نویسه است');
          options.forEach((option,index)=>{if(!option)issues.push(`گزینه ${index+1} خالی است`);else if(option.length>100)issues.push(`گزینه ${index+1} بیشتر از ۱۰۰ نویسه است`);});
          const normalizedLevel=normalizeImportValue(rawLevel),levelKey=importHeaderKey(normalizedLevel);let level=0;
          if(/^[1-5](?:\.0+)?$/.test(normalizedLevel))level=Math.trunc(Number(normalizedLevel));
          else level=LEVELS.findIndex(label=>importHeaderKey(label)===levelKey)+1;
          if(level<1||level>5)issues.push('سطح باید یکی از پنج سطح میزان یا عدد ۱ تا ۵ باشد');
          const correctKey=importHeaderKey(rawCorrect);let correctIndex=-1;
          if(/^[1-4](?:\.0+)?$/.test(normalizeImportValue(rawCorrect)))correctIndex=Number(normalizeImportValue(rawCorrect))-1;
          else{
            const labelMap={'الف':0,'ا':0,'a':0,'ب':1,'b':1,'ج':2,'c':2,'د':3,'d':3};
            if(Object.prototype.hasOwnProperty.call(labelMap,correctKey))correctIndex=labelMap[correctKey];
            else correctIndex=options.findIndex(option=>normalizeImportValue(option).toLocaleLowerCase()===normalizeImportValue(rawCorrect).toLocaleLowerCase());
          }
          if(correctIndex<0||correctIndex>3)issues.push('شمارهٔ گزینهٔ درست باید ۱ تا ۴ یا متن دقیق یکی از گزینه‌ها باشد');
          if(issues.length)errors.push({row:i+1,message:issues.join('؛ ')});
          else valid.push({question,category,level,options,correctIndex});
        }
        return {valid,errors};
      }
      async function importQuestionsFromFile(file) {
        try{
          const extension=String(file.name||'').split('.').pop().toLowerCase();let rows;
          if(extension==='xlsx')rows=await readXlsxQuestionRows(file);
          else if(extension==='csv')rows=parseCsvRows(await file.text());
          else throw new Error('لطفاً فایل Excel با پسوند .xlsx یا فایل CSV با کدگذاری UTF-8 انتخاب کن.');
          const parsed=parseImportedQuestionRows(rows);
          if(!parsed.valid.length){
            const errors=parsed.errors.slice(0,15);bulkImportReport={kind:'error',title:'سؤالی وارد نشد',message:'در فایل ردیف معتبری برای افزودن پیدا نشد؛ سرستون‌ها و ردیف‌های داده را بررسی کن.',errors,moreErrors:Math.max(0,parsed.errors.length-errors.length)};
            renderAdminContent();return;
          }
          const now=Date.now(),newQuestions=parsed.valid.map((item,index)=>({...item,id:`q-import-${now}-${index}-${Math.random().toString(36).slice(2,7)}`,published:true,createdAt:now+index})),next=[...questions,...newQuestions];
          try{localStorage.setItem(KEYS.questions,JSON.stringify(next));}
          catch(_){bulkImportReport={kind:'error',title:'ذخیره‌سازی انجام نشد',message:'فضای ذخیره‌سازی این مرورگر کافی نیست؛ بخشی از سؤال‌ها وارد نشد. فایل را نزد خودت نگه دار و فضای مرورگر را بررسی کن.',errors:[]};renderAdminContent();return;}
          questions=next;adminFilter='all';adminSearch='';const displayedErrors=parsed.errors.slice(0,15);
          bulkImportReport={kind:'success',title:'ورود گروهی کامل شد',message:`${faNum(newQuestions.length)} سؤال معتبر به بانک اضافه و منتشر شد.${parsed.errors.length?` ${faNum(parsed.errors.length)} ردیف ناقص یا نامعتبر وارد نشد.`:''} سؤال‌های قبلی حفظ شدند.`,errors:displayedErrors,moreErrors:Math.max(0,parsed.errors.length-displayedErrors.length)};
          renderAdminContent();showToast(`${faNum(newQuestions.length)} سؤال به بانک اضافه شد.`);
        }catch(error){
          bulkImportReport={kind:'error',title:'فایل خوانده نشد',message:error?.message||'فایل قابل خواندن نیست؛ از قالب میزان و فرمت .xlsx استفاده کن.',errors:[]};renderAdminContent();
        }
      }

          return;
        }
        if(event.key===KEYS.settings&&!isAdminRoute){
          const nextSettings=loadSettings(),previousPublic={...settings},nextPublic={...nextSettings};
          delete previousPublic.competitionCodes;delete nextPublic.competitionCodes;
          if(JSON.stringify(previousPublic)===JSON.stringify(nextPublic)){
            settings=nextSettings;if(isArabicUser()){currentArabicSettingsValue=null;void ensureArabicSettingsTranslation();}if(userGame.phase==='lobby')updateCompetitionEntryState();return;
          }
        }
        if(!event.key||[KEYS.questions,KEYS.settings,KEYS.scores,KEYS.adminPin].includes(event.key)){
          questions=loadQuestions();settings=loadSettings();scores=loadJson(KEYS.scores,[]);competitionReports=loadCompetitionReports();competitionAttempts=loadCompetitionAttempts();
          if(isAdminRoute){if(managerSessionIsOpen())renderAdminShell();}
          else {renderUser();}
        }
      });
      function syncUserPanelFromStorage() {
        if(isAdminRoute || document.hidden) return;
        const nextQuestions=loadQuestions(),nextSettings=loadSettings(),nextScores=loadJson(KEYS.scores,[]);
        const changed=JSON.stringify(nextQuestions)!==JSON.stringify(questions)||JSON.stringify(nextSettings)!==JSON.stringify(settings)||JSON.stringify(nextScores)!==JSON.stringify(scores);
        if(!changed)return;
        questions=nextQuestions;settings=nextSettings;scores=nextScores;
        renderUser();
      }
      window.addEventListener('focus',syncUserPanelFromStorage);
      document.addEventListener('visibilitychange',syncUserPanelFromStorage);
      prepareEditor();boot();
    })();
  </script>
</body>
</html>
